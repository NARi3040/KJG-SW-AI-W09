name: Daily scrum discussion
on:
  schedule:
    - cron: '0 0 * * *'   # 매일 한국시간 09:00
  workflow_dispatch:

permissions:
  discussions: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DAYS=(일 월 화 수 목 금 토)
          W=${DAYS[$(TZ=Asia/Seoul date +%w)]}
          TITLE="$(TZ=Asia/Seoul date +%-m/%-d)($W)"

          BODY=$(cat <<'EOF'
          ### 구현
          - [ ] 할 일 입력

          ### 테스트
          - [ ] 할 일 입력

          ### 협업
          - [ ] 할 일 입력
          EOF
          )

          gh api graphql -f query='
            mutation($repo: ID!, $cat: ID!, $title: String!, $body: String!) {
              createDiscussion(input: {repositoryId: $repo, categoryId: $cat, title: $title, body: $body}) {
                discussion { url }
              }
            }' \
            -f repo="R_kgDOVKxRWQ" \
            -f cat="DIC_kwDOVKxRWc4DIgpw" \
            -f title="$TITLE" \
            -f body="$BODY"